apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: fraud
  labels: {app: fraud-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: fraud-api}
  template:
    metadata:
      labels: {app: fraud-api}
    spec:
      containers:
        - name: api
          image: fraud-api:latest        # built via: minikube image build -t fraud-api:latest .
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: fraud
spec:
  selector: {app: fraud-api}
  ports:
    - {port: 8000, targetPort: 8000}
  type: ClusterIP
