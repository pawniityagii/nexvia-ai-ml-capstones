# Local stack: Kafka + Zookeeper + MLflow + scoring API + dashboard.
# Train the model first (python -m src.models.train_xgboost) so ./artifacts is
# populated; it is bind-mounted into the API and dashboard containers.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: ["./mlruns:/mlflow"]

  api:
    build: .
    depends_on: [kafka]
    ports: ["8000:8000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on: [api]
    ports: ["8501:8501"]
    volumes:
      - ./artifacts:/app/artifacts
